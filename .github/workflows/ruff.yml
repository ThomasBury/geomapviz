name: RuffCov

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --only-binary=:all: uv==0.12.15
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --only-binary=:all: --no-binary=geomapviz -e '.[interactive,lint,test]'
      - name: Lint
        run: |
          .venv/bin/ruff check src tests examples
          .venv/bin/ruff format --check src tests examples
      - name: Type check
        run: .venv/bin/ty check --python .venv
      - name: Test
        if: matrix.python-version != '3.12'
        run: .venv/bin/python -m pytest
      - name: Generate coverage report
        if: matrix.python-version == '3.12'
        run: .venv/bin/python -m pytest --cov=geomapviz --cov-report=xml
      - name: Save coverage report
        if: >-
          matrix.python-version == '3.12' &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  codecov:
    needs: run
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Codecov automatically uses tokenless uploads for fork pull requests.
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
