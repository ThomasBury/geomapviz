# https://docs.readthedocs.com/platform/stable/intro/zensical.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - 'python -m pip install --only-binary=:all: uv==0.12.15'
      - 'uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --only-binary=:all: --group docs'
    build:
      html:
        - zensical build --clean
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html/"
      - cp -R site/. "$READTHEDOCS_OUTPUT/html/"
