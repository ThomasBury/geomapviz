[project]
site_name = "Geomapviz — 2.0.2 documentation"
site_url = "https://geomapviz.readthedocs.io/"
site_description = "Prepare, compare and map geographic means and exposure-weighted rates."
strict = true
nav = [
  { "Overview" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Examples" = [
    { "Gallery and reproduction" = "examples/index.md" },
    { "Belgium: geographic means" = "examples/belgium.md" },
    { "Belgium: changing geographic scale" = "examples/aggregation.md" },
    { "Belgium: observed and predicted rates" = "examples/rates.md" },
    { "Netherlands: postcode geography" = "examples/netherlands.md" },
    { "Netherlands: measured population data" = "examples/demographics.md" },
  ] },
  { "Guides" = [
    { "Aggregation" = "aggregation.md" },
    { "Geography" = "geography.md" },
    { "Plotting and export" = "plotting.md" },
    { "Arithmetic reference" = "arithmetic.md" },
  ] },
  { "API and migration" = "api.md" },
  { "Release notes" = "release-notes.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.markdown_extensions]
tables = {}
"pymdownx.highlight" = {}
"pymdownx.superfences" = {}

[project.markdown_extensions."pymdownx.snippets"]
base_path = ["."]
check_paths = true
